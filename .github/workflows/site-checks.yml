name: Site checks

on:
  pull_request:
    branches: [main, 'translation/**']
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Site validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan Git history for secrets
        run: bash scripts/check-secrets.sh

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.14.1'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Audit dependencies
        env:
          # A pull request compares with its base branch, a push with the commit before it, a manual run with main.
          AUDIT_BASE: ${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref || 'main') }}
        run: node scripts/audit-new-advisories.mjs

      - name: Type-check the site source
        run: npm run typecheck

      - name: Build website, security headers and CSP check
        run: npm run build

      - name: Run regression tests
        run: npm test

      - name: Check internal links
        run: node scripts/check-links.mjs

      - name: Check every page for sideways overflow
        run: node scripts/check-overflow.mjs

      # A dispatched run's checks never count for a pull request, so the release sync's run reports its result as a status.
      - name: Report the result on the commit
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
          -f state="$STATE" -f context='Site validation'
          -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
